<style>
:root{
  --bg:#0d1117; --bg-2:#11161f; --panel:#151c27; --panel-2:#1b2430;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --tx:#e8edf4; --tx-2:#9aa7b8; --tx-3:#6b7889;
  --orange:#ff8b26; --green:#00c98c;
  --r:14px; --mx:1180px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{
  background:var(--bg); color:var(--tx);
  font:400 16px/1.65 'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(900px 620px at 12% -8%, rgba(255,139,38,.16), transparent 62%),
    radial-gradient(760px 560px at 92% 6%, rgba(0,201,140,.11), transparent 60%),
    radial-gradient(700px 700px at 50% 108%, rgba(255,139,38,.07), transparent 65%);
}
body::after{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),
                   linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 78% 62% at 50% 32%,#000 32%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 78% 62% at 50% 32%,#000 32%,transparent 100%);
}
h1,h2,h3,h4{font-family:'Space Grotesk','Inter',sans-serif}
.wrap{max-width:var(--mx);margin:0 auto;padding:0 28px}
a{color:inherit}

/* ---------- nav ---------- */
nav{
  position:fixed; top:0; left:0; right:0; z-index:50;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  background:rgba(13,17,23,.72); border-bottom:1px solid transparent;
  transition:border-color .3s var(--ease), background .3s var(--ease);
}
nav.stuck{border-bottom-color:var(--line);background:rgba(13,17,23,.9)}
nav .wrap{display:flex;align-items:center;gap:26px;height:64px}
.brand{font:600 16px/1 'Space Grotesk',sans-serif;letter-spacing:-.02em;
       text-decoration:none;white-space:nowrap}
.brand i{color:var(--orange);font-style:normal}
.links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.links a{
  font-size:13.5px;color:var(--tx-2);text-decoration:none;padding:7px 11px;
  border-radius:8px;transition:color .2s,background .2s;white-space:nowrap
}
.links a:hover{color:var(--tx);background:rgba(255,255,255,.05)}
.links a.on{color:var(--orange)}
.lang{
  font:600 12px/1 'Space Grotesk',sans-serif;letter-spacing:.09em;
  color:var(--tx-2);background:transparent;border:1px solid var(--line-2);
  border-radius:8px;padding:8px 12px;cursor:pointer;
  transition:color .2s,border-color .2s,background .2s
}
.lang:hover{color:var(--bg);background:var(--orange);border-color:var(--orange)}

/* ---------- hero ---------- */
header{padding:132px 0 72px}
.hero{display:grid;grid-template-columns:1fr 268px;gap:56px;align-items:start}
.kicker{
  display:inline-flex;align-items:center;gap:9px;font:500 12.5px/1 'Space Grotesk',sans-serif;
  letter-spacing:.15em;text-transform:uppercase;color:var(--orange);margin-bottom:22px
}
.kicker::before{content:'';width:26px;height:1.5px;background:var(--orange)}
h1{font-size:clamp(38px,6.1vw,62px);line-height:1.03;letter-spacing:-.035em;font-weight:600}
h1 em{font-style:normal;color:var(--green)}
.lead{
  font-size:clamp(18px,2.3vw,23px);line-height:1.42;color:var(--tx);
  margin-top:20px;max-width:19ch;font-weight:500;
  font-family:'Space Grotesk',sans-serif;letter-spacing:-.015em
}
.intro{color:var(--tx-2);margin-top:24px;max-width:60ch;font-size:16.5px}
.cta{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:9px;text-decoration:none;
  font:500 14.5px/1 'Space Grotesk',sans-serif;padding:13px 21px;border-radius:10px;
  border:1px solid var(--line-2);color:var(--tx);
  transition:transform .25s var(--ease),background .25s,border-color .25s,color .25s
}
.btn:hover{transform:translateY(-2px)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#12161c;font-weight:600}
.btn.pri:hover{box-shadow:0 12px 30px -12px rgba(255,139,38,.7)}
.btn.sec:hover{background:rgba(255,255,255,.06);border-color:var(--line-2)}
.avatar{position:relative}
.avatar img{
  width:100%;border-radius:var(--r);display:block;
  filter:grayscale(1) contrast(1.04);transition:filter .5s var(--ease),transform .5s var(--ease)
}
.avatar:hover img{filter:grayscale(0) contrast(1);transform:translateY(-4px)}
.avatar::after{
  content:'';position:absolute;left:0;right:0;bottom:-1px;height:5px;
  background:var(--green);border-radius:0 0 var(--r) var(--r)
}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
       border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:64px}
.stat{background:var(--bg-2);padding:22px 20px;transition:background .3s}
.stat:hover{background:var(--panel-2)}
.stat b{display:block;font:600 30px/1 'Space Grotesk',sans-serif;color:var(--orange);
        letter-spacing:-.03em}
.stat span{display:block;margin-top:7px;font-size:12.5px;color:var(--tx-3);line-height:1.4}

/* ---------- secciones ---------- */
section{padding:76px 0;border-top:1px solid var(--line)}
.shead{display:flex;align-items:baseline;gap:14px;margin-bottom:38px;flex-wrap:wrap}
.shead h2{font-size:clamp(24px,3.4vw,33px);letter-spacing:-.03em;font-weight:600}
.shead .n{font:500 12px/1 'Space Grotesk',sans-serif;color:var(--tx-3);letter-spacing:.13em}

.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px;
  transition:transform .3s var(--ease),border-color .3s,background .3s
}
.card:hover{transform:translateY(-3px);border-color:var(--line-2);background:var(--panel-2)}
.card h3{font-size:17.5px;letter-spacing:-.015em;margin-bottom:9px;font-weight:600}
.card p{color:var(--tx-2);font-size:15px}

.stack{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
       border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:230px 1fr;gap:26px;background:var(--bg-2);
     padding:20px 24px;transition:background .3s}
.row:hover{background:var(--panel)}
.row dt{font:600 14.5px/1.4 'Space Grotesk',sans-serif;color:var(--green);letter-spacing:-.01em}
.row dd{color:var(--tx-2);font-size:14.5px;line-height:1.6}

/* ---------- experiencia ---------- */
.job{border-left:1px solid var(--line-2);padding:0 0 44px 30px;position:relative}
.job:last-child{padding-bottom:0}
.job::before{
  content:'';position:absolute;left:-5px;top:7px;width:9px;height:9px;border-radius:50%;
  background:var(--bg);border:2px solid var(--tx-3);transition:border-color .3s,transform .3s
}
.job:hover::before{border-color:var(--orange);transform:scale(1.25)}
.job.now::before{border-color:var(--green);box-shadow:0 0 0 4px rgba(0,201,140,.16)}
.per{font:600 11.5px/1 'Space Grotesk',sans-serif;letter-spacing:.13em;color:var(--tx-3);
     text-transform:uppercase}
.job h3{font-size:20px;letter-spacing:-.02em;margin-top:9px;font-weight:600}
.job h4{font-size:17px;letter-spacing:-.015em;margin-top:9px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.tag{font:500 11.5px/1 'Space Grotesk',sans-serif;color:var(--green);
     background:rgba(0,201,140,.09);border:1px solid rgba(0,201,140,.2);
     padding:5px 9px;border-radius:6px}
.job p{color:var(--tx-2);margin-top:14px;font-size:15px;max-width:78ch}
.job ul{list-style:none;margin-top:14px;max-width:78ch}
.job li{color:var(--tx-2);font-size:15px;padding-left:19px;position:relative;margin-bottom:11px}
.job li::before{content:'';position:absolute;left:0;top:10px;width:8px;height:1.5px;
                background:var(--orange)}
.job strong{color:var(--tx);font-weight:600}
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
.mini div{background:var(--bg-2);border:1px solid var(--line);border-radius:11px;padding:17px 19px;
          transition:border-color .3s,background .3s}
.mini div:hover{border-color:var(--line-2);background:var(--panel)}
.mini b{display:block;font:600 14.5px/1.35 'Space Grotesk',sans-serif;margin-bottom:6px}
.mini span{color:var(--tx-2);font-size:13.8px;line-height:1.55}

/* ---------- formacion ---------- */
.edu{display:grid;grid-template-columns:1fr 300px;gap:44px;align-items:start}
.cert{border-bottom:1px solid var(--line);padding:17px 0}
.cert:last-child{border-bottom:0}
.cert b{display:block;font:600 14px/1 'Space Grotesk',sans-serif;color:var(--orange);
        margin-bottom:8px}
.cert span{color:var(--tx-2);font-size:14.3px;line-height:1.6}
.side h3{font-size:15px;margin-bottom:14px;font-weight:600}
.lang-row{display:flex;justify-content:space-between;padding:9px 0;
          border-bottom:1px solid var(--line);font-size:14.5px}
.lang-row:last-child{border-bottom:0}
.lang-row span:last-child{color:var(--tx-3);font-variant-numeric:tabular-nums}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{font-size:12.5px;color:var(--tx-2);border:1px solid var(--line-2);border-radius:99px;
      padding:6px 12px;transition:color .25s,border-color .25s}
.pill:hover{color:var(--orange);border-color:var(--orange)}
.degree{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
        padding:22px 24px;margin-bottom:26px}
.degree b{display:block;font:600 17px/1.35 'Space Grotesk',sans-serif;margin:7px 0 5px}
.degree span{color:var(--tx-2);font-size:14px}

/* ---------- contacto ---------- */
.contact{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cbox{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;
  text-decoration:none;display:block;
  transition:transform .3s var(--ease),border-color .3s,background .3s
}
a.cbox:hover{transform:translateY(-3px);border-color:var(--orange);background:var(--panel-2)}
.cbox small{display:block;font:500 11px/1 'Space Grotesk',sans-serif;letter-spacing:.13em;
            text-transform:uppercase;color:var(--tx-3);margin-bottom:9px}
.cbox b{font-weight:500;font-size:14.5px;word-break:break-word}
footer{padding:40px 0 56px;color:var(--tx-3);font-size:13px;
        display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---------- animacion de entrada ---------- */
.rv{opacity:0;transform:translateY(18px);
    transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:34px}
  .avatar{max-width:210px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2,.mini{grid-template-columns:1fr}
  .row{grid-template-columns:1fr;gap:7px}
  .edu{grid-template-columns:1fr;gap:34px}
  .links{display:none}
  header{padding:104px 0 56px}
  section{padding:58px 0}
  .lead{max-width:none}
}
@media (max-width:520px){
  .wrap{padding:0 20px}
  .stats,.contact{grid-template-columns:1fr}
  .job{padding-left:22px}
}
@media print{
  body::before,body::after,nav{display:none}
  body{background:#fff;color:#111}
  .card,.stack,.row,.cbox,.degree{background:#fff;border-color:#ddd}
  section{page-break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .rv{opacity:1;transform:none}
  html{scroll-behavior:auto}
}
</style>
</head>

 Service Catalogue and the Contract Conditions Infrastructure, under ITIL methodology."}], "early": "**IRDB Consulting** (2007) · Risk functional analyst for a bank: scoring application and resolution of external audit findings.  **Atos** (2003-2007) · Analyst in the Project Management Office and Risk systems analyst with PACBASE on mainframe, building the Risk Data Warehouse for Basel compliance.  **Petróleos de Venezuela S.A.** (1994-2003) · Progression from mail services to Accounts Payable Analyst: over 200 external creditors and a team of 8.", "earlyLabel": "Early Career", "education": [["1992 - 1996", "BSc in Computer Engineering", "Instituto Universitario de Nuevas Profesiones"]], "certs": [["Scrum.org", "PSM I · PSM II · PSPO I · SPS · PAL I · PAL-EBM · PSK I · PSU I"], ["Scaled Agile (SAFe 5)", "Agilist (SA) · Product Owner/Product Manager (POPM) · DevOps Practitioner (SDP) · Lean Portfolio Management (LPM)"], ["Kanban University", "Team Kanban Practitioner (TKP) · Kanban Management Professional (KMP)"], ["Leadership & Organisation", "Management 3.0 · Sociocracy 3.0 · unFIX · Wardley Maps · OKR Lab · Lean Change Management · Digital Facilitator"], ["AI & Data", "Generative AI for Productivity and Agile Management (233 Academy) · ChatGPT Prompt Engineering (DeepLearning.AI) · Collaborative Writing and Coding with OpenAI Canvas (DeepLearning.AI) · Microsoft Fabric (6 modules, Microsoft Learn) · Google Antigravity"], ["Business", "Digital Entrepreneurship (ISDI)"]], "certsNote": "25 certifications and 15 accredited courses listed on LinkedIn.", "languages": [["Spanish", "Native"], ["English", "4 / 10"], ["Galician", "4 / 10"], ["Italian", "4 / 10"]], "sector": ["Agile & Lean Mindset", "Portfolio Management", "Flow Metrics", "Organisational Design", "Applied AI & Agentic Systems", "Strategic Facilitation"]}};
const STATS=[["20+", "years"], ["8", "years_agile"], ["23", "squads"], ["25", "certs_n"]];

const D=DATA; let cur='es';

const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rich=s=>esc(s).split('**').map((p,i)=>i%2?'<strong>'+p+'</strong>':p).join('');
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;
                   if(h!=null)e.innerHTML=h;return e;};

function job(cls,per,title,tags,body,bullets,tag='h3'){
  const j=el('article','job'+(cls?' '+cls:''));
  if(per) j.append(el('div','per',esc(per)));
  j.append(el(tag,'',esc(title)));
  if(tags){const t=el('div','tags');
    tags.split('·').forEach(x=>t.append(el('span','tag',esc(x.trim()))));j.append(t);}
  if(body) body.split('\n').forEach(p=>j.append(el('p','',rich(p))));
  if(bullets){const u=el('ul');bullets.forEach(b=>u.append(el('li','',rich(b))));j.append(u);}
  return j;
}

function render(lang){
  cur=lang; const d=D[lang], u=d.ui;
  document.documentElement.lang=lang;
  document.title='Francisco López Cacheda — '+u.kicker;
  document.querySelector('meta[name=description]').content=u.meta_d;

  // nav
  const nv=document.getElementById('nav-links'); nv.innerHTML='';
  ['perfil','enfoque','stack','experiencia','formacion','contacto']
    .forEach((id,i)=>{const a=el('a','',esc(u.nav[i]));a.href='#'+id;nv.append(a);});
  document.getElementById('lang').textContent=u.toggle;
  document.getElementById('lang').title=u.toggle_title;

  // hero
  document.getElementById('kicker').textContent=u.kicker;
  document.getElementById('lead').textContent=u.lead;
  document.getElementById('intro').innerHTML=rich(d.intro);
  document.getElementById('cta-1').textContent=u.cta_contact;
  const cv=document.getElementById('cta-2');
  cv.textContent=u.cta_cv;
  cv.href='CV_Francisco_Lopez_Cacheda_2026_'+lang.toUpperCase()+'_web.pdf';

  const st=document.getElementById('stats'); st.innerHTML='';
  STATS.forEach(([n,k])=>{const s=el('div','stat');
    s.append(el('b','',n),el('span','',esc(u[k])));st.append(s);});

  // enfoque
  document.getElementById('h-focus').textContent=u.s_focus;
  const f=document.getElementById('focus'); f.innerHTML='';
  d.highlights.forEach(([t,b])=>{const c=el('div','card');
    c.append(el('h3','',esc(t)),el('p','',esc(b)));f.append(c);});

  // stack
  document.getElementById('h-stack').textContent=u.s_stack;
  const s=document.getElementById('stack-list'); s.innerHTML='';
  d.stack.forEach(([a,b])=>{const r=el('div','row');
    r.append(el('dt','',esc(a)),el('dd','',esc(b)));s.append(r);});

  // experiencia
  document.getElementById('h-exp').textContent=u.s_exp;
  const e=document.getElementById('exp'); e.innerHTML='';
  e.append(job('now',d.current.period,d.current.title,'',d.current.body));
  d.engagements.forEach(g=>e.append(
    job('',g.period,g.client,g.tags,'',g.bullets,'h4')));

  const sh=el('article','job');
  sh.append(el('h4','',esc(u.short_h)));
  const m=el('div','mini');
  d.short.forEach(([t,b])=>{const x=el('div');
    x.append(el('b','',esc(t)),el('span','',esc(b)));m.append(x);});
  sh.append(m); e.append(sh);

  const o=document.getElementById('exp2'); o.innerHTML='';
  o.append(el('h3','',esc(u.other_h)));
  d.others.forEach(c=>o.append(job('',c.period,c.title,c.tags,c.body,null,'h4')));
  const ec=el('article','job');
  ec.append(el('h4','',esc(d.earlyLabel)),el('p','',rich(d.early)));
  o.append(ec);

  // formacion
  document.getElementById('h-edu').textContent=u.s_edu;
  const dg=document.getElementById('degree'); dg.innerHTML='';
  d.education.forEach(([p,t,sc])=>{const x=el('div','degree');
    x.append(el('div','per',esc(p)),el('b','',esc(t)),el('span','',esc(sc)));dg.append(x);});
  const cs=document.getElementById('certs'); cs.innerHTML='';
  d.certs.forEach(([g,i])=>{const c=el('div','cert');
    c.append(el('b','',esc(g)),el('span','',esc(i)));cs.append(c);});
  document.getElementById('certs-note').textContent=d.certsNote;
  document.getElementById('h-langs').textContent=u.langs;
  const lg=document.getElementById('langs'); lg.innerHTML='';
  d.languages.forEach(([n,v])=>{const r=el('div','lang-row');
    r.append(el('span','',esc(n)),el('span','',esc(v)));lg.append(r);});
  document.getElementById('h-sector').textContent=u.nav[0];
  const sp=document.getElementById('sector'); sp.innerHTML='';
  d.sector.forEach(x=>sp.append(el('span','pill',esc(x))));

  // contacto
  document.getElementById('h-contact').textContent=u.s_contact;
  document.getElementById('lbl-loc').textContent=u.loc;
  document.getElementById('foot').textContent=u.foot;

  reveal();
}

function reveal(){
  const nodes=document.querySelectorAll('.rv');
  if(!('IntersectionObserver' in window)){          // sin soporte: mostrar todo
    nodes.forEach(n=>n.classList.add('in')); return;
  }
  const io=new IntersectionObserver((es)=>{
    es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target);}});
  },{threshold:.08,rootMargin:'0px 0px -40px 0px'});
  nodes.forEach((n,i)=>{
    n.style.transitionDelay=Math.min(i%6,5)*45+'ms'; io.observe(n);
  });
}

document.getElementById('lang').onclick=()=>{
  render(cur==='es'?'en':'es');
  try{localStorage.setItem('cv-lang',cur);}catch(e){}
};

addEventListener('scroll',()=>{
  document.getElementById('nav').classList.toggle('stuck',scrollY>10);
  let act='';
  document.querySelectorAll('section[id],header[id]').forEach(s=>{
    if(s.getBoundingClientRect().top<=120) act=s.id;
  });
  document.querySelectorAll('#nav-links a').forEach(a=>
    a.classList.toggle('on',a.getAttribute('href')==='#'+act));
},{passive:true});

let start='es';
try{start=localStorage.getItem('cv-lang')||(navigator.language||'es').slice(0,2);}catch(e){}
render(start==='en'?'en':'es');

</script>
