<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página no encontrada — Francisco López Cacheda</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbfbfa">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='4' y='4' width='92' height='92' rx='20' fill='%23ffffff' stroke='%232b2b2b' stroke-width='8'/><text x='50' y='73' font-size='60' font-family='sans-serif' font-weight='800' fill='%232b2b2b' text-anchor='middle'>F</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=IBM+Plex+Mono:wght@500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(0.99 0.002 90); --line:oklch(0.9 0.004 90); --ink:oklch(0.18 0 0);
  --tx-2:oklch(0.5 0.005 90); --brick:oklch(0.55 0.2 25);
  --display:'Baloo 2',system-ui,-apple-system,sans-serif;
  --body:'Work Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh; display:grid; place-items:center; padding:32px;
  background:var(--bg); color:var(--ink);
  font:400 16px/1.65 var(--body);
  -webkit-font-smoothing:antialiased; text-align:center;
}
/* misma reticula de studs que el resto del sitio */
body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image:radial-gradient(var(--line) 1.5px,transparent 1.6px);
  background-size:26px 26px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 20%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 20%,transparent 100%);
}
.code{font:800 88px/1 var(--display);color:var(--brick);letter-spacing:-.02em}
h1{font:700 26px/1.25 var(--display);margin:14px 0 10px;letter-spacing:-.01em}
p{color:var(--tx-2);max-width:44ch;margin:0 auto 28px}
a{
  display:inline-block;text-decoration:none;font:600 14.5px/1 var(--display);
  padding:13px 21px;border-radius:10px;border:2px solid var(--ink);
  background:var(--ink);color:#fff;
  transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s cubic-bezier(.22,1,.36,1);
}
a:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--brick)}
@media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Esta página no existe</h1>
    <p>El enlace que has seguido no lleva a ninguna parte. Puede que haya cambiado o que nunca existiera.</p>
    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
